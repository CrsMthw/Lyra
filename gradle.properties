org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Parallel Tooling API model building — speeds up IDE (Android Studio) sync, which fetches a model
# per project. Real Gradle build option, opt-in/default-off: StartParameterBuildOptions
# $ParallelToolingModelBuildingOption in gradle-start-parameter.jar. Does NOT affect ./gradlew CLI
# builds; org.gradle.parallel above is the one that parallelises task execution.
org.gradle.tooling.parallel=true

android.useAndroidX=true
kotlin.code.style=official
