[versions]
agp                  = "9.2.1"
kotlin               = "2.3.21"
ksp                  = "2.3.8"
coreKtx              = "1.18.0"
lifecycleRuntime     = "2.10.0"
activityCompose      = "1.13.0"
composeBom           = "2026.05.01"
material3            = "1.5.0-alpha20"
navigation           = "2.9.8"
datastore            = "1.2.1"
securityCrypto       = "1.1.0"
appauth              = "0.11.1"
retrofit             = "3.0.0"
okhttp               = "5.3.2"
coil                 = "3.4.0"
windowManager        = "1.5.1"
coroutines           = "1.11.0"
splashscreen         = "1.2.0"
gson                 = "2.14.0"
palette              = "1.0.0"
graphicsShapes       = "1.1.0"

[libraries]
androidx-core-ktx                    = { group = "androidx.core",              name = "core-ktx",                    version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx       = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",       version.ref = "lifecycleRuntime" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntime" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle",         name = "lifecycle-runtime-compose",   version.ref = "lifecycleRuntime" }
androidx-activity-compose            = { group = "androidx.activity",          name = "activity-compose",            version.ref = "activityCompose" }
androidx-compose-bom                 = { group = "androidx.compose",           name = "compose-bom",                 version.ref = "composeBom" }
androidx-ui                          = { group = "androidx.compose.ui",        name = "ui" }
androidx-ui-graphics                 = { group = "androidx.compose.ui",        name = "ui-graphics" }
androidx-ui-tooling                  = { group = "androidx.compose.ui",        name = "ui-tooling" }
androidx-ui-tooling-preview          = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
androidx-material3                   = { group = "androidx.compose.material3", name = "material3",                   version.ref = "material3" }
androidx-material-icons-extended     = { group = "androidx.compose.material",  name = "material-icons-extended" }
androidx-navigation-compose          = { group = "androidx.navigation",        name = "navigation-compose",          version.ref = "navigation" }
androidx-datastore-preferences       = { group = "androidx.datastore",         name = "datastore-preferences",       version.ref = "datastore" }
androidx-security-crypto             = { group = "androidx.security",          name = "security-crypto",             version.ref = "securityCrypto" }
androidx-window                      = { group = "androidx.window",            name = "window",                      version.ref = "windowManager" }
androidx-splashscreen                = { group = "androidx.core",              name = "core-splashscreen",           version.ref = "splashscreen" }
appauth                              = { group = "net.openid",                 name = "appauth",                     version.ref = "appauth" }
retrofit                             = { group = "com.squareup.retrofit2",     name = "retrofit",                    version.ref = "retrofit" }
retrofit-converter-gson              = { group = "com.squareup.retrofit2",     name = "converter-gson",              version.ref = "retrofit" }
okhttp                               = { group = "com.squareup.okhttp3",       name = "okhttp",                      version.ref = "okhttp" }
coil-compose                         = { group = "io.coil-kt.coil3",           name = "coil-compose",                version.ref = "coil" }
coil-okhttp                          = { group = "io.coil-kt.coil3",           name = "coil-network-okhttp",         version.ref = "coil" }
kotlinx-coroutines-android           = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-android",  version.ref = "coroutines" }
gson                                 = { group = "com.google.code.gson",       name = "gson",                        version.ref = "gson" }
androidx-palette                     = { group = "androidx.palette",            name = "palette-ktx",                 version.ref = "palette" }
androidx-graphics-shapes             = { group = "androidx.graphics",            name = "graphics-shapes",             version.ref = "graphicsShapes" }
androidx-material3-adaptive          = { group = "androidx.compose.material3.adaptive", name = "adaptive" }

[plugins]
android-application = { id = "com.android.application",             version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
